name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          if [ -f Tempest-Android-Proyecto.zip ]; then
            unzip -oq Tempest-Android-Proyecto.zip -d /tmp/tempest
            PROJECT_DIR="$(find /tmp/tempest -name settings.gradle -print -quit | xargs dirname)"
          else
            PROJECT_DIR="$(find . -name settings.gradle -not -path './.git/*' -print -quit | xargs dirname)"
          fi
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tempest-Android-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
